name: CI

# Neden: bu depoda derlemeyi/testi doğrulayan hiçbir otomasyon yoktu ve test projesi fark edilmeden
# aylarca derlenemez durumda kaldı (servisler yeni bağımlılık aldıkça testler kırıldı). Bu iş akışı
# üç ucu da (backend / web / mobil) her push ve PR'da kapıya alır.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı dal için art arda gelen çalıştırmalarda eskisini iptal et (CI kuyruğu şişmesin).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    # GERÇEK VERİTABANI OLMADAN BU İŞ ANLAMSIZDIR.
    #
    # SOMUT AÇIK: 78 test (transaction, SELECT … FOR UPDATE, MariaDB lehçesi) yalnızca gerçek bir
    # sunucuyla çalışıyor; CI'da bağlantı dizesi TANIMLI OLMADIĞI için hepsi SESSİZCE atlanıyor,
    # kapı yine de yeşil yanıyordu. Yani en pahalı hataların (çift tahsilat, kayıp güncelleme,
    # MariaDB'nin reddettiği SQL) tek savunması hiç çalışmıyordu. MariaDB seçildi çünkü CANLI
    # ortam MariaDB — lehçe farkları (takma adlı DELETE gibi) yalnız orada görünür.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-test-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/GuzellikMerkeziYonetimi.slnx

      # warnaserror: uyarı birikmesin — bugün 0 uyarı ile derleniyor, öyle kalsın.
      - name: Build
        run: dotnet build backend/GuzellikMerkeziYonetimi.slnx --no-restore --configuration Release --warnaserror

      # --blame-hang: TAKILMA DA KIRILMADIR. Bu paket geçmişte belirsiz biçimde takıldı ve hangi
      # testin astığı görünmüyordu; artık takılan testin adı raporlanır. Süre cömert: tek bir
      # migration testi dakikalar sürebiliyor, dar bir eşik yavaş koşuyu "hata" sanardı.
      - name: Test (gerçek MariaDB ile)
        env:
          GUZELLIK_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=ci-test-root;AllowPublicKeyRetrieval=true;SslMode=Disabled;"
          # Atlamayı KAPATIR: sunucuya erişilemezse testler atlanmaz, iş DÜŞER.
          GUZELLIK_TEST_MYSQL_REQUIRED: "1"
        run: |
          dotnet test backend/GuzellikMerkeziYonetimi.slnx \
            --no-build --configuration Release --verbosity normal \
            --blame-hang --blame-hang-timeout 20m --blame-hang-dump-type none \
            --logger "trx;LogFileName=backend-tests.trx" \
            --results-directory backend/TestResults

      # ATLANAN TEST = ÖRTÜLÜ BOŞLUK. Yukarıdaki REQUIRED bayrağı veritabanı testlerini korur;
      # bu adım geri kalan her şey için aynı kuralı uygular: bir test [Skip] ile susturulduysa
      # kapı bunu görünür kılar, sessizce yeşil yanmaz.
      - name: Atlanan test var mı?
        if: always()
        run: |
          trx=$(find backend/TestResults -name '*.trx' | head -1)
          if [ -z "$trx" ]; then echo "HATA: test sonucu (.trx) bulunamadı."; exit 1; fi

          # ÖLÇÜT total - executed. .trx'teki `notExecuted` sayacı atlanan testlerde bile 0
          # kalıyor (yerelde doğrulandı: 3 test atlandı, notExecuted="0"); ona bakan bir kapı
          # hiçbir zaman ateşlenmezdi. `executed`, ÇALIŞTIRILAN test sayısıdır — atlananlar
          # buraya girmez, dolayısıyla fark güvenilirdir.
          counters=$(grep -o '<Counters[^/]*/>' "$trx" | head -1)
          total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
          executed=$(echo "$counters" | grep -o 'executed="[0-9]*"' | grep -o '[0-9]*' | head -1)
          skipped=$(( ${total:-0} - ${executed:-0} ))
          echo "Toplam: ${total:-0} · çalıştırılan: ${executed:-0} · atlanan: $skipped"

          if [ "$skipped" -ne 0 ]; then
            echo "HATA: $skipped test atlandı. Gerçek veritabanı testleri CI'da ATLANAMAZ;"
            echo "atlanan test, doğrulanmamış kod demektir. Sebebi giderin ya da testi silin."
            grep -o 'testName="[^"]*"' "$trx" | head -20 || true
            exit 1
          fi

      # UYGULANMIŞ MIGRATION'LAR DEĞİŞMEZDİR. Bir migration yayınlandıktan sonra gövdesi
      # değiştirilirse MigrationId aynı kaldığı için ESKİ kurulumlar yeni SQL'i HİÇ görmez:
      # aynı sürüm numarasıyla iki farklı şema ortaya çıkar. Düzeltme her zaman YENİ bir
      # (forward-only) migration olmalıdır. Bu kapı geçmişte üç migration'da gerçekleşmiş
      # sessiz değişikliği yakalar.
      - name: Migration dosyaları değişmedi mi? (hash manifesti)
        run: bash backend/tools/migration-manifest.sh verify

      # Şema değişikliği yapılıp migration eklenmeyi unutulmuş mu? (Bu projede ham SQL bootstrap yok,
      # şema YALNIZCA migration'larla geliyor — unutulan migration canlıda "unknown column" demek.)
      - name: Bekleyen model değişikliği yok mu?
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.* || dotnet tool update --global dotnet-ef --version 10.0.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes \
            --project backend/src/GuzellikMerkezi.Infrastructure \
            --startup-project backend/src/GuzellikMerkezi.Api

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install
        working-directory: Frontend
        run: npm ci

      - name: Typecheck
        working-directory: Frontend
        run: npm run typecheck

      - name: Build
        working-directory: Frontend
        # Build sırasında API'ye gidilmez; yalnızca derleme/prerender doğrulanır.
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build

  mobile:
    name: Mobil (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SÜRÜM SABİT. `channel: stable` her koşuda O ANKİ en güncel Flutter'ı çeker: CI, hiç kimsenin
      # üzerinde çalışmadığı bir araç zinciriyle analiz yapar ve yeni analizör kuralları yüzünden
      # kod değişmeden kırmızıya döner (bu gerçekten yaşandı). Geliştirme ortamıyla AYNI sürüm
      # sabitlenir; SDK yükseltmesi ayrı ve bilinçli bir iş olmalıdır (yükseltip raporladıklarını
      # düzeltmek, sürprizle karşılaşmak değil).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Bağımlılıklar
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test
